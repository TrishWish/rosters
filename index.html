/* Participant ID: send each participant a link ending in ?pid=P01 (P02, P03 and so on) */
(function(){
  var raw = new URLSearchParams(location.search).get('pid') || '';
  var pid = /[{}]/.test(raw) ? 'no_pid' : (raw.replace(/[^A-Za-z0-9_-]/g,'').slice(0,40) || 'no_pid');

  window.clarity('identify', pid, null, null, pid);
  window.clarity('set', 'participant', pid);
})();

<style>
/* Design System tokens (resolved from Figma variables). The product UI is light only. */
:root{
  color-scheme: light;
  --white:#ffffff; --tb:#282732; --navy:#1d1761;

.c-g100{ color:var(--g100); } .c-g60{ color:var(--g60); } .c-ocean{ color:var(--ocean); } .c-cherry{ color:var(--cherry); } .c-pu{ color:var(--pu); } .c-white{ color:#fff; }

<script>
/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ic = (name, cls='', size='') => `<i data-lucide="${name}" class="i ${size} ${cls}" aria-hidden="true"></i>`;
const badge = (style, tone, label) => `<span class="badge ${style} ${tone}">${esc(label)}</span>`;
const hl = (tone, txt) => { const m = String(txt).match(/^([\d$][\d,.$]*)(.*)$/); return `<span class="hl ${tone}">${m ? `<b>${m[1]}</b>${esc(m[2])}` : esc(txt)}</span>`; };
const money = n => '$' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const ring = (col, count, label) => `<span><span class="ring" style="border-color:var(${col})"></span><b>${count}</b> ${esc(label)}</span>`;
function names(list, showAll){ if(showAll || list.length <= 2) return list.join(', '); return list.slice(0,2).join(', ') + ` +${list.length-2} more`; }

/* ---------- state ---------- */
const S = {
  page: 'dashboard', navMode: 'vision', sbMin: false,
  open: { 'Rostering hub':true, 'Workforce':false, 'Time and attendance':false, 'Insights':false, 'Rostering admin':false },
  rosterView: 'list', showAll: false, showAvail: true, calView: 'Weekly grid',
  osTab: 'Needs action', osSel: new Set(['o1','o2']),
  overlay: null, fillTab: 'Suitable', fillSel: new Set(['Grace Ilori','Hannah Wu']),
  offerSel: new Set(['Grace Ilori','Hannah Wu','Mei Tanaka']), offerMode: 'first',
  qeStaff: null, rules: null, wvTab: 'Availability'
};

/* ---------- navigation ---------- */
const NAV = [
  { label:'Dashboard', icon:'layout-dashboard', page:'dashboard' },
  { label:'Rostering hub', icon:'calendar-days', items:[['Rosters','rosters'],['Shifts','shiftcal'],['Programs'],['Templates']] },
  { label:'Workforce', icon:'users', page:'staff' },
  { label:'Time and attendance', icon:'clock', items:[['Shift approvals','approvals'],['Timesheets']] },
  { label:'Insights', icon:'chart-column', vision:true, items:[['Coverage and fill rate'],['Hours and overtime'],['Travel']] },
  { label:'Rostering admin', near:'Rostering settings', icon:'settings', items:[['Roster rules'],['Suitability rules','rules','vision'],['Services (line item clusters)',null,'vision']] }
];
function go(page, label){ S.page = page || 'placeholder'; S.phLabel = label; S.overlay = null; S.vsOpen=false; S.maOpen=false; S.menu=null; S.wp=null; S.pop2=null; for (const g of NAV) if ((g.items||[]).some(([l,p]) => (page && p===page) || (!page && l===label))) S.open[g.label]=true; render(); window.scrollTo(0,0); }

function banner(){
  return `<div class="banner protonote" role="note"><span><strong>Prototype only.</strong> This is an early concept with sample data. It will change as we gather your feedback and run user testing.</span></div>`;
}
const TOPNAV_SHELL = `<header class="topnav">
    <div class="logo logo-ph" role="img" aria-label="Logo" onclick="__LOGOCLICK__">Logo</div>
    <nav class="modules" aria-label="Modules">__MODS__</nav>
    <div class="utils"><div class="searchbox">${ic('search','c-g60')}Search (Alt-s)</div>${ic('bell','', 'i20')}${ic('circle-help','','i20')}${ic('menu','','i20')}</div>
  </header>`;
function sidebar(){
  const near = S.navMode === 'near';
  const pageOfLabel = {}; NAV.forEach(g => (g.items||[]).forEach(([l,p]) => { if(p) pageOfLabel[l]=p; }));
  const isSel = (label, page) => page ? (S.page === page || (S.page==='wip' && page==='rosters')) : (S.page==='placeholder' && S.phLabel===label);
  if (S.sbMin){
    return `<aside class="sidebar min" aria-label="Rostering menu">${NAV.filter(g=>!(near&&g.vision)).map(g=>{
      const sel = g.page ? pgSel(g.page) : (g.items||[]).some(([l,p]) => isSel(l,p));
      return `<button class="nav-item ${sel?'sel':''}" title="${esc(near&&g.near?g.near:g.label)}" onclick="${g.page?`go('${g.page}')`:`S.sbMin=false;render()`}">${ic(g.icon,'','i20')}</button>`; }).join('')}
      <div class="sb-foot"><button class="nav-item" title="Expand menu" onclick="S.sbMin=false;render()">${ic('panel-left','','i20')}</button></div></aside>`;
  }
  let h = `<aside class="sidebar" aria-label="Rostering menu"><div class="sb-title">Rostering</div>`;
  for (const g of NAV){
    if (near && g.vision) continue;
    const label = near && g.near ? g.near : g.label;
    if (g.page){ h += `<button class="nav-item ${pgSel(g.page)?'sel':''}" onclick="go('${g.page}')">${ic(g.icon,'','i20')}${label}</button>`; continue; }
    const open = S.open[g.label];
    h += `<button class="nav-item" aria-expanded="${open}" onclick="S.open['${g.label}']=!S.open['${g.label}'];render()">${ic(g.icon,'','i20')}${label}${ic(open?'chevron-down':'chevron-right','chev')}</button>`;
    if (open) for (const [l,p,only] of g.items){ if (near && only==='vision') continue;
      h += `<button class="nav-item nav-sub ${isSel(l,p)?'sel':''}" onclick="go(${p?`'${p}'`:'null'},'${esc(l)}')">${esc(l)}</button>`; }
  }
  h += `<div class="sb-foot"><button class="nav-item sm muted" onclick="S.sbMin=true;render()">${ic('panel-left')}Minimise menu</button></div></aside>`;
  return h;
}
function header(crumbs, title, sub, right='', badges=''){
  return `<div><div class="crumbs"><button class="xbtn" aria-label="${S.sbMin?'Expand':'Minimise'} menu" title="${S.sbMin?'Expand':'Minimise'} menu" onclick="S.sbMin=!S.sbMin;render()">${ic('panel-left','c-g60')}</button>${mapCrumbs(crumbs).map((c,i)=>(i?ic('chevron-right','c-g60','i14'):'')+`<span class="${i===crumbs.length-1?'cur':''}">${esc(c)}</span>`).join('')}</div>
    <div class="title-row"><div class="stack" style="gap:4px"><div style="display:flex;gap:12px;align-items:center"><h1 class="h1">${esc(title)}</h1>${badges}</div>${sub?`<div class="muted">${esc(sub)}</div>`:''}</div><div class="actions">${right}</div></div></div>`;
}
const sel = (label, value, w=180) => `<div class="field" style="width:${w}px">${label?`<label>${esc(label)}</label>`:''}<div class="select" role="button" tabindex="0"><span class="trunc">${esc(value)}</span>${ic('chevron-down','c-g100')}</div></div>`;
const deeplink = (label, onclick) => `<button class="deeplink" onclick="${onclick}">${esc(label)}${ic('arrow-right','','i20')}</button>`;
const ghost = (icon, label, onclick='') => `<button class="btn btn-ghost" onclick="${onclick}">${ic(icon)}${esc(label)}</button>`;
const sw = (on, label, onclick) => `<button class="switch" role="switch" aria-checked="${on}" onclick="${onclick}"><span class="trk"></span>${esc(label)}</button>`;
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.innerHTML=ic('check')+esc(msg); document.body.appendChild(t); lucide.createIcons(); setTimeout(()=>t.remove(),2600); }
/* ---------- shared shift data ---------- */
const DAYS = ['Mon 14','Tue 15','Wed 16','Thu 17','Fri 18','Sat 19','Sun 20']; const TODAY = 2;

function shiftCard(o, view){
  const cls = ['shift', o.status||'', (S.overlay && S.overlay.shift===o.id)?'selected':''].join(' ');
  const act = (o.status==='open' && !o.cont) ? `openFill('${o.id}')` : `openQE('${o.id}')`;
  let h = `<button class="${cls}" onclick="${act}" aria-label="${esc(o.time+' '+(o.roster||''))}">`;
  h += `<span class="top"><span class="time">${esc(o.time)}</span>${o.ratio?`<span class="ratio">${o.ratio}</span>`:''}</span>`;
  if (o.sleep) h += `<span class="sleep">${ic('moon','','i12')}Sleep ${o.sleep}</span>`;
  if (o.cont) h += `<span class="sl">${ic('arrow-right','','i12')}<span>${esc(o.cont)}</span></span>`;
  if (view==='staff' && o.who) h += `<span class="muted">${esc(o.who)}</span>`;
  if (o.staff && o.staff.length) h += `<span class="sl">${ic('user','','i12')}<span>${esc(names(o.staff,S.showAll))}</span></span>`;
  if (o.openText) h += `<span class="sl openl">${ic('user-search','','i12')}<span>${esc(o.openText)}</span></span>`;
  if (o.parts && o.parts.length) h += `<span class="sl">${ic('users','','i12')}<span>${esc(names(o.parts,S.showAll))}</span></span>`;
  if (o.tags) h += `<span class="sl trunc1">${ic('tag','','i12')}<span>${esc(o.tags.join(', '))}</span></span>`;

function toastAct(msg){ const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.innerHTML=ic('check')+`<span>${esc(msg)}</span><button class="btn-link" style="color:#fff;margin-left:8px" onclick="this.parentNode.remove();scUndo()">Undo</button><button class="btn-link" style="color:#fff" onclick="this.parentNode.remove();scPublish()">Publish now</button>`; document.body.appendChild(t); if(window.lucide) lucide.createIcons(); setTimeout(()=>t.remove(),7000); }
function scAssign(name){ const so=findOpen(S.scSel); if(!so) return; const st=SC_STAFF.find(s=>s.name===name); const o=so.o;
  so.r.cells[so.d].splice(so.i,1);
  const n=scA(so.d,{staff:[name],time:o.time,roster:o.roster,parts:o.parts,tags:o.tags,tz:o.tz,unpub:true,sleep:o.sleep,suit:SC_MATCH[name]?SC_MATCH[name][1]:'Strong'});
  st.cells[so.d].push(n); S.lastUndo={so,o,st,n}; S.scSel=null; S.scLayers.suit=false; S.pop2=null; renderPop(); render(); toastAct(`${name} assigned to ${o.date} ${o.time}${FV()?'':' '+o.tz}. Saved as unpublished.`); }
function scUndo(){ const u=S.lastUndo; if(!u) return; u.st.cells[u.so.d]=u.st.cells[u.so.d].filter(x=>x!==u.n); u.so.r.cells[u.so.d].splice(u.so.i,0,u.o); S.lastUndo=null; render(); toast('Undone'); }
function scPublish(){ const u=S.lastUndo; if(u&&u.n){ u.n.unpub=false; u.n.status='filled'; } S.lastUndo=null; render(); toast('Shift published'); }
function scApprove(openId){ const so=findOpen(openId); const lindy=SC_STAFF.find(s=>s.name==='Lindy C'); const d=so?so.d:4;
  if(so) so.r.cells[so.d].splice(so.i,1); lindy.cells[d]=lindy.cells[d].filter(x=>x.kind!=='request'); lindy.req=false;
  const o=so?so.o:{time:'2–6pm',roster:SC_SIL,parts:SC_P3,tags:amT,tz:'QLD'};
  lindy.cells[d].push(scA(d,{staff:['Lindy C'],time:o.time,roster:o.roster,parts:o.parts,tags:o.tags,tz:o.tz,unpub:true,offers:'Requested by Lindy · Approved'}));
  S.pop2=null; renderPop(); render(); toast('Lindy C assigned to Fri 2–6pm. Saved as unpublished. Jo S will be told it’s filled.'); }
function scApplyClash(){ const so=findOpen(S.scSel); const ch=S.pop2.choice; const lindy=SC_STAFF.find(s=>s.name==='Lindy C'); const d=so?so.d:2; const cur=lindy.cells[2].find(x=>x.time==='2–6pm' && x.kind==='assigned'); const reg=SC_REG[0];
  if(so) so.r.cells[so.d].splice(so.i,1);
  const src=so?so.o:{time:'3–7pm',roster:SC_HGH,parts:['Kai U','Lena V'],tags:['Personal Care'],tz:'QLD'};
  const newA=scA(d,{staff:['Lindy C'],time:src.time,roster:src.roster,parts:src.parts,tags:src.tags,tz:src.tz,unpub:true,crit:ch==='anyway'?1:0});
  if (ch==='shorten' && cur){ cur.time='2–3pm'; cur.unpub=true; cur.note='Shortened from 2–6pm'; cur.health=null; reg.cells[2].push(scO(2,{kind:'open',urg:'h26',time:'3–6pm',roster:SC_SIL,parts:SC_P3,detail:'Reopened from Lindy’s shift · 2 suitable',tags:amT,suit:'2 suitable',offers:'None'})); }
  if (ch==='move' && cur){ lindy.cells[2]=lindy.cells[2].filter(x=>x!==cur); reg.cells[2].push(scO(2,{kind:'open',urg:'h26',time:'2–6pm',roster:SC_SIL,parts:SC_P3,detail:'Reopened from Lindy’s shift · 2 suitable',tags:amT,suit:'2 suitable',offers:'None'})); }
  lindy.cells[d].push(newA); S.pop2=null; S.scSel=null; S.scLayers.suit=false; renderPop(); render();
  toast(ch==='shorten'?'Lindy’s 2–6pm shortened to 2–3pm, 3–6pm reopened, and she’s on 3–7pm. Unpublished.':ch==='move'?'Lindy moved to 3–7pm and her 2–6pm reopened. Unpublished.':'Lindy assigned with an overlap warning. Unpublished.'); }
function pop2(){ const p=S.pop2; const pos=`left:${Math.max(8,p.x)}px;top:${Math.max(8,p.y)}px`; const close=`<div class="catch" onclick="S.pop2=null;renderPop()"></div>`;
  if (p.type==='openmenu'){ const so=findOpen(p.id); if(!so) return ''; const o=so.o;
    const items=[['user-search','Find staff','Turns on suitability for this shift',`scFind('${o.id}')`],['send',NOSUIT()?'Offer to staff':'Offer to best matches',NOSUIT()?'Choose who to offer it to':'Pick from ranked staff',`S.pop2=null;renderPop();openOffer('${o.id}')`],['megaphone','Open to anyone','Eligible staff in the region can request it',`S.pop2=null;renderPop();toast('Opened to eligible staff in ${so.r.key}')`],['pencil','Edit shift',null,`S.pop2=null;renderPop();openQE('${o.id}')`],['ban','Cancel shift',null,`scCancel('${o.id}')`]];
    return `<div class="pop" style="${pos};width:300px" role="menu" aria-label="Open shift actions"><div class="pop-h"><div class="stack grow" style="gap:4px">${badge(...URG[o.urg])}<span class="semi">${esc(o.date)} · ${esc(o.time)}${FV()?'':' '+o.tz}</span><span class="sm muted">${esc(o.roster)}</span></div><button class="xbtn" aria-label="Close" onclick="S.pop2=null;renderPop()">${ic('x')}</button></div><div style="padding:6px">${items.filter(x=>!(NOSUIT()&&x[1]==='Find staff')).map(([i,l,s,a])=>`<button class="optrow" role="menuitem" style="align-items:flex-start" onclick="${a}">${ic(i,i==='ban'?'c-cherry':'c-g100')}<span class="stack" style="gap:0"><span>${l}</span>${s?`<span class="sm muted">${s}</span>`:''}</span></button>`).join('')}</div></div>`; }
  if (p.type==='request'){ const rq=SHIFTS[p.id]; const target = rq.kind==='request' ? rq.reqFor : p.id; const so=findOpen(target); const o=so?so.o:rq;
    return close+`<div class="pop" style="${pos}" role="dialog" aria-label="Review request"><div class="pop-h"><div class="stack grow" style="gap:0"><span class="semi">Lindy C requested this shift</span><span class="sm muted">${esc(o.date)} · ${esc(o.time)}${FV()?'':' '+o.tz} · ${esc(o.roster)}</span></div><button class="xbtn" aria-label="Close" onclick="S.pop2=null;renderPop()">${ic('x')}</button></div><div class="pop-b"><span class="sm muted" style="display:flex;gap:8px;align-items:center">How she fits ${badge('light','em','Strong')}</span>${[['check','em','Available 12–8pm'],['check','em','Under contracted hours (12 / 24 h)'],['heart','ocean','Worked with Ted, Tim and Trevor this week'],['triangle-alert','gold','Would be her 2nd shift at this house today']].map(([i,c,t])=>`<span class="sm" style="display:flex;gap:6px;align-items:center">${icc(i,c)}${t}</span>`).join('')}<div class="sm" style="display:flex;justify-content:space-between;align-items:center;background:var(--g05);padding:6px 8px;border-radius:4px"><span>1 other request: Jo S (Possible)</span><button class="btn-link sm" onclick="toast('Comparing Lindy C and Jo S')">Compare</button></div></div><div class="pop-f"><button class="btn btn-primary" onclick="scApprove('${target}')">Approve and assign</button><button class="btn btn-outline" onclick="S.pop2=null;renderPop();toast('Request declined. Lindy will be told in Sidekick.')">Decline</button><button class="btn-link" onclick="S.pop2=null;renderPop();openOffer('${target}')">Offer to others</button></div></div>`; }
  if (p.type==='clash'){ const opts=[['shorten','Shorten her 2–6pm to 2–3pm','Then assign her 3–7pm here. 3–6pm on SIL Wattle House reopens as an open shift.'],['move','Move her to this shift','Her 2–6pm on SIL Wattle House reopens in full.'],['anyway','Assign anyway','Creates a 3-hour overlap. Shows as a critical warning on both shifts.']];
    return close+`<div class="pop" style="${pos};width:360px" role="dialog" aria-label="Clash options"><div class="pop-h"><div class="stack" style="gap:2px"><span class="semi">Use Lindy for 3–7pm?</span><span class="sm muted">She’s on SIL Wattle House 3:1 from 2–6pm${FV()?'':' QLD'}. Pick how to handle the overlap.</span></div></div><div class="pop-b">${opts.map(([k,t,d])=>`<button class="radio ${p.choice===k?'on':''}" role="radio" aria-checked="${p.choice===k}" onclick="S.pop2.choice='${k}';renderPop()"><span class="dot"></span><span class="stack"><span class="semi">${t}</span><span class="sm muted">${d}</span></span></button>`).join('')}</div><div class="pop-f"><span class="sm muted grow">Changes stay unpublished until you publish.</span><button class="btn btn-outline" onclick="S.pop2=null;renderPop()">Cancel</button><button class="btn btn-primary" onclick="scApplyClash()">Apply</button></div></div>`; }
  return ''; }

  const primary = a.mode==='assign' ? 'Create and publish' : a.fill==='offer' ? `Create and offer to ${n}` : 'Create and open to anyone';

/* Rosters calendar: same status language as the shift calendar */
function cardStatusLine(o){
  if (o.done==='complete') return `<span class="sline">${badge('outline','grey','Completed')}</span>`;
  if (o.done==='incomplete' && o.reason==='Not checked out') return `<span class="sline">${badge('light','cherry','Missing check-out')}</span>`;
  if (o.done==='incomplete') return `<span class="sline">${badge('outline','grey','Completed')}<span class="wchip warn">${ic('triangle-alert')}1</span><span class="tiny muted">Shift notes missing</span></span>`;
  if (o.done==='notfilled') return `<span class="cl nf">Not filled</span>`;
  if (o.status==='progress') return `<span class="sline">${badge('light','em','In progress')}<span class="tiny muted">since 9:58am</span></span>`;
  return ''; }

/* ---------- Shifts: Calendar | Table | Open shifts ---------- */
Object.assign(S, { scGroup:'staff', osUrg:'all', osSel:new Set() });
function scAllRows(){ const rows=[]; for (const r of scRegions()) r.cells.forEach(c=>c.forEach(o=>{ if (shiftOk(o)) rows.push({o, st:null}); })); for (const st of scStaffList()) st.cells.flat().forEach(o=>{ if (shiftOk(o) && o.kind!=='request') rows.push({o, st}); }); return rows.sort((a,b)=>a.o.day-b.o.day); }
function scStatusCell(o){ if (o.kind==='open') return o.past ? '<span class="cl nf" style="display:inline-flex">Not filled</span>' : badge(...URG[o.urg]); if (o.kind==='request') return badge('light','pu','Requested'); return badge(...HEALTH[o.health||'sched']); }
function scStatusLabel(o){ if (o.kind==='open') return o.past ? 'Not filled' : URG[o.urg][2]; if (o.kind==='request') return 'Requested'; return HEALTH[o.health||'sched'][2]; }
const SC_STATUS_ORDER = ['Critical · under 2 hrs','Missing check-in','Missing check-out','Starts in 2–6 hrs','Check in soon','Starts in under 24 hrs','Request/s received','Requested','Offers sent','Open','Checked in','In progress','Scheduled','Completed','Not filled'];
const scHead = (sel) => `<thead><tr><th><input type="checkbox" class="chk" aria-label="Select all" ${sel?`onchange="${sel}"`:''}></th><th>Date</th><th>Time (local)</th><th>Roster and participants</th><th>Staff</th><th>Status</th><th>Suitability</th><th>Offers and requests</th><th>Warnings</th><th>Published</th><th></th></tr></thead>`;
function scRow(x, opts={}){ const o=x.o, st=x.st, open=o.kind==='open';
  const icons=`<button class="rowicon" aria-label="View shift" title="View" onclick="openQE('${o.id}')">${ic('eye')}</button><button class="rowicon" aria-label="Edit shift" title="Edit" onclick="openQE('${o.id}')">${ic('pencil')}</button>`;
  const warnC=(o.past&&open)?'<span class="muted">—</span>':(o.crit||o.heads)?`<span style="display:inline-flex;gap:4px">${o.heads?`<span class="wchip warn">${ic('triangle-alert')}${o.heads}</span>`:''}${o.crit?`<span class="wchip crit">${ic('triangle-alert')}${o.crit}</span>`:''}</span>`:'<span class="muted">—</span>';
  const pubC=(o.unpub||o.unpubOpen)?badge('block','navy','Unpublished'):'<span class="sm muted">Published</span>';
  const timeC=`<span class="nowrap" style="display:inline-flex;gap:4px;align-items:center">${o.sleep?ic('moon','c-pu','i14'):''}${esc(o.time)}${tzLbl(o.tz)}</span>`;
  const rost=`<div class="stack"><span>${esc(o.roster)}</span><span class="sm muted">${esc(names(o.parts,false))}</span></div>`;
  const staffC = open ? (o.past?'<span class="muted">—</span>':o.staffText?`<div class="stack"><span style="display:inline-flex;gap:4px;align-items:center">${ic('user','c-g100','i14')}${o.staffText}</span><span class="sm muted">1 of 2 positions filled</span></div>`:`<span style="display:inline-flex;gap:4px;align-items:center;color:var(--ocean)">${ic('user-search','c-ocean','i14')}Open</span>`) : esc(st?st.name:(o.staff[0]||''));
  const suitC = open ? (o.past?'<span class="muted">—</span>':`<span class="sm">${esc(o.suit||'')}</span>`) : badge(...(o.suit==='Possible'?['light','gold','Possible']:['light','em','Strong']));
  const offC = open ? (o.past?'<span class="muted">—</span>':(o.offers&&o.offers!=='None'?`<span class="sm" style="display:inline-flex;gap:4px;align-items:center">${o.offerIcon?ic(o.offerIcon,'c-g100','i12'):''}${esc(o.offers)}</span>`:'<span class="sm muted">None</span>')) : (o.offers?`<span class="sm">${esc(o.offers)}</span>`:'<span class="muted">—</span>');
  const findAct = opts.fill ? `openFill('${o.id}')` : `scFind('${o.id}')`;
  let act='';
  if (open && !o.past){ if (o.urg==='req') act=`<button class="btn btn-outline btn-sm" onclick="scOpenReq('${o.id}',event)">Review request</button>`; else if (o.urg==='off') act=`<button class="btn btn-secondary btn-sm" onclick="openOffer('${o.id}')">View offers</button>`; else act=`<button class="btn btn-secondary btn-sm" onclick="${findAct}">Find staff</button>`; }
  else if (o.health==='miss') act=`<button class="btn btn-outline btn-sm" onclick="toast('Calling ${st?st.name:''}')">Contact</button>`;
  else if (o.health==='missout') act=`<button class="btn btn-outline btn-sm" onclick="toast('Reminder sent to ${st?st.name:''}')">Send reminder</button>`;
  else if (o.kind==='request') act=`<button class="btn btn-outline btn-sm" onclick="scOpenReq('${o.id}',event)">Review request</button>`;

function spOverview(p){ const row=(k,v)=>`<div style="display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--g20)"><span class="muted">${k}</span><span>${v}</span></div>`;

function spHours(p){ const fort=S.spRange==='fortnight'; const ro=rosteredFor(p); const rostH=ro.flat().reduce((a,[s,e])=>a+(e-s),0)*(fort?2:1);
  const leaveDays=p.leave.filter(l=>l[1]!=null).reduce((a,l)=>a+((l[2]==null?l[1]:l[2])-l[1]+1),0); const availH=p.pat.reduce((a,r)=>a+(r?r[1]-r[0]:0),0)*(fort?2:1) - leaveDays*(p.pat[4]?p.pat[4][1]-p.pat[4][0]:0);
  const con=p.hrs?p.hrs*(fort?2:1):null, leaveH=leaveDays*7.6, head=con!=null?con-rostH-leaveH:null;
  const seg=`<span class="mini-seg"><button aria-pressed="${!fort}" onclick="S.spRange='week';render()">Week</button><button aria-pressed="${fort}" onclick="S.spRange='fortnight';render()">Fortnight</button></span>`;
  const rows=[['Contracted',con!=null?con+' h':'Casual'],['Rostered',rostH.toFixed(rostH%1?1:0)+' h'],['Available',Math.max(0,availH)+' h'],['Approved leave',leaveH?leaveH+' h':'None'],['Headroom before overtime',head!=null?hl(head<0?'cherry':'em',(head<0?'Over by ':'')+Math.abs(head).toFixed(head%1?1:0)+' h'):'—']];
  return `<section class="card"><div class="card-h"><div class="stack"><h2 class="h3">${fort?'This fortnight':'This week'}</h2><span class="sm muted">${fort?'26 Oct – 8 Nov 2026':'26 Oct – 1 Nov 2026'}</span></div>${seg}</div>${rows.map(([k,v])=>`<div style="display:flex;justify-content:space-between"><span class="muted">${k}</span><span class="semi">${v}</span></div>`).join('')}</section>`; }
function spAvailability(p){ const fort=S.spRange==='fortnight', H0=6, H1=22, pct=h=>((h-H0)/(H1-H0)*100).toFixed(2)+'%'; const ro=rosteredFor(p); const ch=(S.changes[p.id]||[]);
  const ruler=`<div style="display:flex;margin-left:96px">${[6,8,10,12,14,16,18,20].map(h=>`<span class="tiny muted" style="flex:1">${h<12?h+'am':h===12?'12pm':(h-12)+'pm'}</span>`).join('')}</div>`;
  const nDays=fort?14:7; let lanes='';
  for (let i=0;i<nDays;i++){ const d=i%7, av=p.pat[d], leave=p.leave.find(l=>l[1]!=null && i>=l[1] && i<=(l[2]==null?l[1]:l[2])), rost=i<7?ro[d]:[], c=ch.filter(x=>x.day===i);
    let top; if (leave) top=`<div class="lane"><span class="b" style="left:0;right:0;background:var(--cherry10);border:1px solid var(--cherry10)">${ic('tree-palm','c-cherry','i12')} Approved ${leave[0].toLowerCase()} · from HR</span></div>`;
    else if (av || c.length) top=`<div class="lane">${av?`<span class="b" style="left:${pct(av[0])};width:calc(${pct(av[1])} - ${pct(av[0])});background:var(--em10);border:1px solid var(--em)">${fmtH(av[0])} – ${fmtH(av[1])}</span>`:''}${c.map(x=>`<span class="b" style="left:${pct(x.from)};width:calc(${pct(x.to)} - ${pct(x.from)});${x.type==='Unavailable'?'background:repeating-linear-gradient(45deg,var(--g10),var(--g10) 4px,#fff 4px,#fff 8px);border:1px solid var(--g60)':'background:var(--em10);border:1px dashed var(--em)'}">${x.type==='Unavailable'?'Unavailable':'Extra'}</span>`).join('')}</div>`;
    else top=`<div class="lane" style="background:var(--g10)"><span class="b sm muted" style="left:0;right:0">Not available</span></div>`;
    const bottom=`<div class="lane" style="height:14px">${rost.map(([a,b,t])=>`<span class="b" style="left:${pct(a)};width:calc(${pct(b)} - ${pct(a)});background:var(--ocean);color:#fff">${esc(t)}</span>`).join('')}</div>`;
    lanes+=`<div style="display:flex;align-items:center"><span class="semi sm" style="width:96px">${DATES14[i]}</span><div class="grow stack" style="gap:4px">${top}${bottom}</div></div>`; }
  const seg=`<span class="mini-seg"><button aria-pressed="${!fort}" onclick="S.spRange='week';render()">Week</button><button aria-pressed="${fort}" onclick="S.spRange='fortnight';render()">Fortnight</button></span>`;
  const base=[['Sat 31 Oct','Extra availability 8am – 2pm','Sidekick · '+p.n.split(' ')[0],['outline','em','Active'],null],['Thu 5 Nov','Unavailable 1pm – 6pm','Sidekick · '+p.n.split(' ')[0],['outline','em','Active'],'Clashes with 1 rostered shift']];
  const changes=[...ch.map(x=>[DATES14[x.day],`${x.type==='Unavailable'?'Unavailable':'Extra availability'} ${fmtH(x.from)} – ${fmtH(x.to)}${x.note?' · '+x.note:''}`,'You · just now',['outline','em','Active'],null]),...base];
  const hist=[...(S.hist[p.id]||[]),['Added extra availability Sat 31 Oct',p.n.split(' ')[0]+' in Sidekick · 3 days ago'],['Removed Sun availability',p.n.split(' ')[0]+' in Sidekick · 2 weeks ago'],['Weekly pattern updated','Zacc Thomas (roster manager) · 1 Sep']];
  return `<div class="notice">${ic('smartphone','','i18')}<span>${esc(p.n.split(' ')[0])} confirmed their availability in Sidekick 3 days ago. Approved leave comes across from HR automatically.</span></div>
  <div class="row"><div class="grow stack" style="gap:24px">
    <section class="card"><div class="card-h"><div class="stack"><h2 class="h3">Weekly availability</h2><span class="sm muted">${fort?'26 Oct – 8 Nov 2026':'26 Oct – 1 Nov 2026'} · repeats weekly from 1 Sep 2026 · ${p.tz} time</span></div><div style="display:flex;gap:12px;align-items:center">${seg}${ghost('repeat','Edit pattern',"toast('Edit weekly pattern')")}</div></div>
      <div class="callegend"><span><span class="sw" style="background:var(--em10);border:1px solid var(--em)"></span>Available</span><span><span class="sw" style="background:var(--ocean)"></span>Rostered</span><span><span class="sw" style="background:var(--cherry10)"></span>Approved leave (from HR)</span><span><span class="sw" style="background:repeating-linear-gradient(45deg,var(--g10),var(--g10) 3px,#fff 3px,#fff 6px);border:1px solid var(--g60)"></span>One-off unavailable</span></div>${ruler}<div class="stack" style="gap:12px">${lanes}</div></section>
    <section class="card"><div class="card-h"><div class="stack"><h2 class="h3">One-off changes</h2><span class="sm muted">Overrides the weekly pattern for specific dates</span></div>${ghost('plus','Add change',"S.overlay={type:'addchange',day:5,ctype:'Unavailable',from:13,to:18,note:''};render()")}</div>
      ${changes.map(([d,c,s,[bs,bt,bl],w])=>`<div style="display:flex;gap:16px;align-items:center;padding-top:12px;border-top:1px solid var(--g20)"><span class="semi" style="width:120px">${d}</span><div class="stack grow"><span>${esc(c)}</span>${w?`<span class="sm">${hl('gold',w)}</span>`:''}</div><span class="sm muted">${s}</span>${badge(bs,bt,bl)}</div>`).join('')}</section></div>
    <div class="stack" style="gap:24px;width:360px;flex:none">${spHours(p)}${isVision()?`<section class="card"><div class="stack"><h2 class="h3">Work preferences</h2><span class="sm muted">Set in Sidekick, used as soft signals in matching</span></div>${[['sun','Prefers morning shifts'],['car','Travels up to 30 min between shifts']].map(([i,t])=>`<div style="display:flex;gap:8px">${ic(i,'c-g100')}${t}</div>`).join('')}</section>`:''}
      <section class="card"><div class="card-h"><h2 class="h3">Recent changes</h2><button class="btn-link sm" onclick="toast('Full availability history opens here')">View full history</button></div>${hist.slice(0,4).map(([t,s])=>`<div style="display:flex;gap:8px">${ic('history','c-g100')}<div class="stack"><span>${esc(t)}</span><span class="sm muted">${esc(s)}</span></div></div>`).join('')}</section></div></div>`; }
function fmtH(h){ const hh=Math.floor(h), m=Math.round((h-hh)*60); const ap=hh>=12?'pm':'am'; const h12=hh%12||12; return h12+(m?':'+String(m).padStart(2,'0'):'')+ap; }
function spLeave(p){ const seg=`<span class="mini-seg"><button aria-pressed="${S.spLeaveView==='list'}" onclick="S.spLeaveView='list';render()">List</button><button aria-pressed="${S.spLeaveView==='calendar'}" onclick="S.spLeaveView='calendar';render()">Calendar</button></span>`;
  const note=`<div class="notice">${ic('info','','i18')}<span>Leave is requested and approved in HR. Approved leave shows here and on the availability calendar, and blocks rostering for those dates.</span></div>`;
  if (!p.leave.length) return note+`<section class="card"><div class="card-h"><h2 class="h3">Upcoming approved leave</h2>${seg}</div><p class="muted" style="margin:0">No upcoming approved leave.</p></section>`;
  let inner;
  if (S.spLeaveView==='list') inner=`<div class="tblwrap"><table class="tbl"><thead><tr><th>Type</th><th>When</th><th>How long</th><th>Status</th><th>Source</th></tr></thead><tbody>${p.leave.map(([t,,,when,dur])=>`<tr><td>${esc(t)}</td><td>${esc(when)}</td><td>${esc(dur)}</td><td>${badge('light','em','Approved')}</td><td class="sm muted">HR</td></tr>`).join('')}</tbody></table></div>`;
  else { const leaveDays = new Set(); for (const [,, , when] of p.leave){ if(/Nov 2026/.test(when)){ const m=when.match(/(\d+)(?:\s*–\s*\w+\s*(\d+))?\s+Nov/); const a=+m[1], b=m[2]?+m[2]:a; for(let d=a; d<=b; d++) leaveDays.add(d); } }
    const first=6; let cells=''; for (let i=0;i<first;i++) cells+='<div></div>'; for (let d=1; d<=30; d++) cells+=`<div class="mday ${leaveDays.has(d)?'leave':''}"><span>${d}</span>${leaveDays.has(d)?`<span class="tiny">Leave</span>`:''}</div>`;
    inner=`<div class="stack" style="gap:8px"><span class="semi">November 2026</span><div class="mgrid">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="tiny muted">${d}</div>`).join('')}${cells}</div></div>`; }
  return note+`<section class="card"><div class="card-h"><div class="stack"><h2 class="h3">Upcoming approved leave</h2><span class="sm muted">${p.leave.length} period${p.leave.length>1?'s':''} · from HR</span></div>${seg}</div>${inner}</section>`; }
function overlayAddChange(){ const o=S.overlay, p=sById(S.spId); const hrs=[...Array(17)].map((_,i)=>i+6);
  const opt=(k,v,cur)=>`<option value="${v}" ${cur==v?'selected':''}>${k}</option>`;
  return `<div class="scrim" onclick="closeOverlay()"></div><div class="dialog" role="dialog" aria-modal="true" aria-label="Add a one-off change" style="width:min(480px,calc(100% - 32px))">
    <div class="dr-h" style="flex-direction:row;gap:12px"><div class="stack grow"><h2 class="h2">Add a one-off change</h2><span class="muted">Overrides ${esc(p.n.split(' ')[0])}’s weekly pattern for one date.</span></div><button class="xbtn" aria-label="Close" onclick="closeOverlay()">${ic('x','','i20')}</button></div>
    <div class="dr-b" style="padding:20px 24px;display:flex;flex-direction:column;gap:12px">
      <div class="field"><label>Date</label><select class="nsel" onchange="S.overlay.day=+this.value">${DATES14.map((d,i)=>opt(d,i,o.day)).join('')}</select></div>
      <div class="seg" style="display:flex">${['Unavailable','Extra availability'].map(t=>`<button style="flex:1" aria-pressed="${o.ctype===t}" onclick="S.overlay.ctype='${t}';render()">${t}</button>`).join('')}</div>
      <div class="grid2"><div class="field"><label>From</label><select class="nsel" onchange="S.overlay.from=+this.value">${hrs.map(h=>opt(fmtH(h),h,o.from)).join('')}</select></div><div class="field"><label>To</label><select class="nsel" onchange="S.overlay.to=+this.value">${hrs.map(h=>opt(fmtH(h),h,o.to)).join('')}</select></div></div>
      <div class="field"><label>Note (optional)</label><div class="input"><input value="${esc(o.note)}" placeholder="e.g. medical appointment" oninput="S.overlay.note=this.value"></div></div></div>
    <div class="dr-f" style="border-radius:0 0 12px 12px"><span class="grow"></span><button class="btn btn-outline" onclick="closeOverlay()">Cancel</button><button class="btn btn-primary" onclick="saveChange()">Add change</button></div></div>`; }
function saveChange(){ const o=S.overlay, p=sById(S.spId); if (o.to<=o.from){ toast('Finish time needs to be after the start'); return; }
  (S.changes[p.id]=S.changes[p.id]||[]).unshift({day:o.day,type:o.ctype,from:o.from,to:o.to,note:o.note});
  (S.hist[p.id]=S.hist[p.id]||[]).unshift([`${o.ctype==='Unavailable'?'Marked unavailable':'Added extra availability'} ${DATES14[o.day]}`,'You · just now']);
  if (o.day>=7) S.spRange='fortnight'; S.overlay=null; render(); toast('One-off change added'); }

 { name:'Tom C', role:'Support worker · Casual', hrs:'0 h this week', state:null, av:[sA('6am–2pm'),sA('6am–2pm'),sA('6am–2pm'),sA('6am–2pm'),sU,sU,sU], cells:[[],[],[],[],[],[],[]] },

function fvRegions(){ return S.fvR.map(n=>({ name:n, sub:'Open shifts', key:n, cells:[0,1,2,3,4,5,6].map(d=>SC_REG.flatMap(r=>r.cells[d]).filter(o=>o.roster===n)) })); }

  return names.map(n=>SC_STAFF.find(s=>s.name===n)||FV_EXTRA.find(s=>s.name===n)).filter(Boolean)

function scDetail(o){ if (!FV()) return o.detail; if (NOSUIT()) return o.staffText ? `${o.staffText}, 1 x unfilled position` : ''; const bits=[]; if (o.staffText) bits.push(`${o.staffText} · 1 of 2 positions filled`);
  if (S.suitAt && !NOSUIT()){ const [s,p]=FV_SP[o.id]||[2,1]; bits.push(`${s} suitable · ${p} possible`); }

  if (o.hnote==='Shift notes missing' || (o.done==='incomplete' && o.reason==='Shift admin incomplete')) heads.push(['Shift notes missing','Notes weren’t completed after the shift']);
  const nc=(o.crit||0)-crit.length, nh=(o.heads||o.warn||0)-heads.length;

/* ---------- Shift approvals v2: auto-approval queue ---------- */
const QUEUE_MS = 6*60*60*1000;
const apIsApproved = r => apStatus(r)==='approved';
function apStatus(r){ if (r.approvedBy) return 'approved';
  if (r.queuedAt){ if (Date.now()-r.queuedAt >= QUEUE_MS){ r.approvedBy='auto'; return 'approved'; } return 'queued'; }
  const f=apFlags(r); if (f.some(x=>x[0]==='crit')) return 'review'; if (f.some(x=>x[0]==='warn')) return 'flagged'; return 'ready'; }
Object.assign(AP_B, { ready:['outline','ocean','Ready'], queued:['light','em','Queued'], approved:['block','em','Approved'] }); delete AP_B.auto;
for (const k of Object.keys(AP_STAT)) delete AP_STAT[k];
Object.assign(AP_STAT, { ready:['Ready to queue','cy'], flagged:['Flagged','gd'], review:['Needs review','c'], compliance:['Missing notes or tasks','plain'], change:['Service changed','plain'], queued:['Queued','em'] });
AP_VIEWS.splice(0, AP_VIEWS.length, ['All completed shifts',{}],['Ready to queue',{stat:'ready'}],['Needs review',{stat:'review'}],['Missing notes or tasks',{stat:'compliance'}],['Service changed',{stat:'change'}],['Queued',{stat:'queued'}]);
function apMatchStat(r,k){ if(!k) return true; const st=apStatus(r);
  if (['ready','flagged','review','queued','approved'].includes(k)) return st===k;
  if (k==='compliance') return r.clients.some(c=>!c.note) || !r.general || r.tasks.some(t=>!t.done); if (k==='change') return !!r.change; return true; }
const apLeft = r => { const ms=Math.max(0, QUEUE_MS-(Date.now()-r.queuedAt)); const h=Math.floor(ms/3600000), m=Math.floor((ms%3600000)/60000); return h?`${h}h ${m}m`:`${m}m`; };
function apBadge(r){ const st=apStatus(r); if (st==='approved') return `<span class="badge apok">Approved</span>`; return badge(...AP_B[st]); }
function apQueue(ids){ let n=0; for (const id of ids){ const r=AP.find(x=>x.id===id); if (r && !r.approvedBy){ r.queuedAt=Date.now(); n++; } } S.ap.sel.clear(); if (S.overlay&&S.overlay.type==='apreview') S.overlay=null; render(); toast(`${n} shift${n===1?'':'s'} queued · auto-approve in 6h`); }
function apApprove(ids){ let n=0; for (const id of ids){ const r=AP.find(x=>x.id===id); if (r && !r.approvedBy){ r.approvedBy='you'; r.queuedAt=null; n++; } } S.ap.sel.clear(); if (S.overlay&&S.overlay.type==='apreview') S.overlay=null; render(); toast(`${n} shift${n===1?'':'s'} approved`); }
function apUnqueue(id){ const r=AP.find(x=>x.id===id); if (r){ r.queuedAt=null; } render(); toast('Taken out of the queue'); }
function apTouch(r){ if (r && r.queuedAt && !r.approvedBy){ r.queuedAt=null; toast('Taken out of the queue. Queue it again when you’re done.'); } }
function apCompliance(){ const base=apRows(); const rows=base.filter(r=>apMatchStat(r,S.ap.stat)); const nReady=base.filter(r=>apStatus(r)==='ready').length; const sel=S.ap.sel;
  const chip = S.ap.stat ? `<span class="statchip">${ic('list-filter','c-ocean','i14')}Showing ${AP_STAT[S.ap.stat][0].toLowerCase()}<button class="xbtn" aria-label="Clear stat filter" onclick="S.ap.stat=null;render()">${ic('x','c-g100','i14')}</button></span>` : '<span></span>';
  const bulk = sel.size ? `<div class="bulkbar"><span class="semi">${sel.size} selected</span><button class="btn btn-secondary btn-sm" onclick="apQueue([...S.ap.sel])">${ic('clock')}Queue selected</button><button class="btn btn-secondary btn-sm" onclick="apApprove([...S.ap.sel])">${ic('check')}Approve now, skip queue</button><span class="grow"></span><button class="btn-link" onclick="S.ap.sel.clear();render()">Clear selection</button></div>` : '';
  const acts = `<div class="tactions2">${chip}<div class="actions" style="gap:16px"><button class="btn btn-ghost" style="height:40px;padding:0" onclick="toast('Choose columns')">${ic('columns-3')}Columns</button><button class="btn btn-ghost" style="height:40px;padding:0" ${nReady?'':'disabled'} onclick="apQueue(apRows().filter(r=>apStatus(r)==='ready').map(r=>r.id))">${ic('clock')}Queue all ready (${nReady})</button></div></div>`;
  const body = rows.map(r=>{ const st=apStatus(r), v=apVar(r), cn=r.clients.filter(c=>c.note).length, td=r.tasks.filter(t=>t.done).length;
    const hrsCell = `<div class="stack" style="gap:2px"><span class="nowrap">${(r.pe-r.ps).toFixed(1).replace('.0','')} h planned</span><span class="sm">${v==null?hl('cherry','No check-out'):`${(r.outT-r.inT-r.brk).toFixed(2).replace(/\.?0+$/,'')} h actual${Math.abs(v)>0.1?' '+hl(Math.abs(v)>0.5?'cherry':'gold',(v>0?'+':'')+Math.round(v*60)+' min'):''}`}</span></div>`;
    const action = st==='ready' ? `<button class="btn btn-secondary btn-sm" onclick="apQueue(['${r.id}'])">Queue</button>` : st==='queued' ? `<button class="btn btn-outline btn-sm" onclick="apUnqueue('${r.id}')">Remove</button>` : (st==='review'||st==='flagged') ? `<button class="btn btn-outline btn-sm" onclick="S.overlay={type:'apreview',id:'${r.id}'};render()">Review</button>` : '';
    return `<tr class="${sel.has(r.id)?'selrow':''} ${st==='approved'?'past':''}"><td><input type="checkbox" class="chk" aria-label="Select" ${sel.has(r.id)?'checked':''} onchange="S.ap.sel.has('${r.id}')?S.ap.sel.delete('${r.id}'):S.ap.sel.add('${r.id}');render()"></td>
      <td class="nowrap">${r.date}</td><td class="nowrap"><div class="stack" style="gap:2px"><span>${esc(r.time)}</span><span class="sm muted">${fmtT(r.inT)} – ${r.outT==null?'?':fmtT(r.outT)}</span></div></td>

      <td>${r.incident?badge('light','cherry','Incident'):'<span class="muted">—</span>'}</td>
      <td>${r.msgs.length?`<button class="apmsgbtn" aria-label="${r.msgs.length} message${r.msgs.length>1?'s':''}" onclick="event.stopPropagation();S.wp=null;S.pop2={type:'apmsg',id:'${r.id}',x:event.clientX,y:event.clientY};renderPop()">${ic('message-square','c-ocean','i14')}${r.msgs.length}</button>`:'<span class="muted">—</span>'}</td>
      <td>${r.change?hl('gold','+'+r.change.hrs+' h'):'<span class="muted">—</span>'}</td>
      <td><div class="stack" style="gap:2px;align-items:flex-start">${apBadge(r)}${st==='queued'?`<span class="tiny muted nowrap">${ic('clock','','i12')} Auto-approves in ${apLeft(r)}</span>`:st==='approved'?`<span class="tiny muted">${r.approvedBy==='auto'?'From queue':'Skipped queue'}</span>`:''}</div></td>
      <td class="r nowrap"><span style="display:inline-flex;gap:12px;align-items:center">${action}<button class="rowicon" aria-label="Open review" title="Review" onclick="S.overlay={type:'apreview',id:'${r.id}'};render()">${ic('eye')}</button></span></td></tr>`; }).join('');
  return `<div class="calwrap">${acts}${bulk}<div class="tblwrap"><table class="tbl aptbl"><thead><tr><th><input type="checkbox" class="chk" aria-label="Select all" onchange="(${JSON.stringify(rows.map(r=>r.id)).replace(/"/g,"'")}).forEach(id=>this.checked?S.ap.sel.add(id):S.ap.sel.delete(id));render()"></th><th>Date</th><th>Planned · actual</th><th>Roster and clients</th><th>Staff</th><th>Hours</th><th>Notes</th><th>Tasks</th><th>Incident</th><th>Messages</th><th>Service change</th><th>Status</th><th></th></tr></thead><tbody>${body||'<tr><td colspan="13" class="muted">No shifts match these filters.</td></tr>'}</tbody></table></div><div class="sm muted" style="padding-top:12px">Showing ${rows.length} of ${AP.length} worker shifts · one row per worker · queued shifts auto-approve after 6 hours</div></div>`; }
function apStatsRow(){ const base=apRows(); return `<div class="statswrap"><div class="stats">${Object.entries(AP_STAT).map(([k,[l,t]])=>statTile(base.filter(r=>apMatchStat(r,k)).length,l,t,`S.ap.stat=S.ap.stat==='${k}'?null:'${k}';render()`,S.ap.stat===k)).join('')}</div></div>`; }
function pageApprovals(){ if (!AP.length){ buildAP(); AP.forEach((r,i)=>{ if (r.auto) r.queuedAt = Date.now() - (i%4===0 ? 400 : 25 + (i*47)%290)*60000; r.auto=false; }); }
  const tab=(k,l)=>`<button aria-pressed="${S.ap.tab===k}" onclick="S.ap.tab='${k}';S.menu=null;render()">${l}</button>`;
  const tabs=`<div class="seg" role="group" aria-label="View">${tab('compliance','Compliance')}${tab('payroll','Payroll')}${tab('finance','Finance')}</div>`;

function overlayApReview(){ const r=AP.find(x=>x.id===S.overlay.id); const st=apStatus(r); const rid=`AP.find(x=>x.id==='${r.id}')`;

const FV_URG = { crit:['block','cherry','Critical · under 2 hrs'], h26:['light','cherry','Starts in 2–6 hrs'], h24:['light','gold','Starts in under 24 hrs'] };
function fvOpenCard(){ const list=[]; for (const r of SC_REG) r.cells.forEach(c=>c.forEach(o=>{ if (o.kind==='open' && !o.past) list.push(o); }));
  list.sort((a,b)=>a.day-b.day || startH(a.time)-startH(b.time)); const show=list.slice(0,8);

  for (const st of SC_STAFF) for (const o of st.cells[1]){ if (o.kind!=='assigned') continue; const s=startH(o.time), e=s+hrsOf(o.time); if (e>24 && (e-24)<=NOW_H) add(o,st,'out',(NOW_H-(e-24))*60); }

function availWindow(a){ if (!a || a[0]!=='a') return null; const t=a[1].replace('Avail ','').trim();
  if (/all day/i.test(t)) return [6,24]; if (/^from /i.test(t)){ try { return [startH(t.replace(/^from /i,'')+'–11pm'), 24]; } catch(_){ return null; } }
  try { const s=startH(t); return [s, s+hrsOf(t)]; } catch(_){ return null; } }
const lblT = h => h>=24 ? (h>24 ? 'overnight' : 'midnight') : fmtT(h);
function fvStaffCell(st, d){ const act=new Set(activeRosters()); const [k,t]=st.av[d]; let h=''; const items=[];
  // continuation of last night's shift
  const prev = d===0 ? PREV_WEEK.filter(p=>p.staff===st.name && act.has(p.roster)) : st.cells[d-1].filter(o=>o.kind==='assigned' && isOvernight(o.time) && act.has(o.roster) && scStatMatch({o}) && shiftOk(o));
  for (const o of prev){ const end = startH('12am–'+(o.time.split('–')[1]||'6am').trim()); items.push([0, contCard(o), [0,end]]); }
  // shifts today, this view and other rosters
  const mine = st.cells[d].filter(o=>o.kind!=='request');
  for (const o of mine){ const s=startH(o.time), e=s+hrsOf(o.time); if (act.has(o.roster)) { if (scStatMatch({o}) && shiftOk(o)) items.push([s, scCard3(o), [s,e]]); } else items.push([s, elseCard(o), [s,e]]); }
  // availability split around shifts
  if (k==='l'){ if (S.scLayers.leave) h+=`<div class="leaveblk"><span class="semi sm" style="display:flex;gap:6px;align-items:center">${ic('tree-palm','c-cherry','i14')}Annual leave</span><span class="sm muted">Approved · all day</span></div>`; }
  else if (S.scLayers.avail){
    const win = availWindow(st.av[d]);
    if (!win) items.push([-1, `<span class="avail ${k}">${esc(MVP()&&k==='u'?'Unavailable':t)}</span>`, null]);
    else { const busy = mine.map(o=>{ const s=startH(o.time); return [s, s+hrsOf(o.time)]; }).concat(prev.map(o=>[0, startH('12am–'+(o.time.split('–')[1]||'6am').trim())])).sort((a,b)=>a[0]-b[0]);
      let cur = win[0]; const segs=[];
      for (const [bs,be] of busy){ if (be<=cur) continue; if (bs>=win[1]) break; if (bs>cur) segs.push([cur, Math.min(bs,win[1])]); cur=Math.max(cur,be); }
      if (cur < win[1]) segs.push([cur, win[1]]);
      for (const [a,b] of segs) if (b-a >= 0.5) items.push([a, `<span class="avail a">Avail ${lblT(a)}–${lblT(b)}</span>`, null]);

/* ---------- Task tracking (Clarity events) ----------
   Task 1: observation only. KPI card clicks are tracked.
   Task 2: critical shift opened (Tweed Heads Day Program), requester (Sofia Torres) assigned and saved.
   Task 3: Rosemary St Residence opened, offer sent to anyone other than the requester (Leo Tran).
   Task 4: all missing check-outs shown.
   Task 5: Leo Tran / Raj Patel check-out row clicked or marked resolved.
   Not a task: all missing check-ins shown (tracked for reference). */
{
  const once = new Set();
  const ev = (name, tags) => track(c => { c('event', name); if (tags) for (const k in tags) c('set', k, String(tags[k])); });
  const evOnce = (name, tags) => { if (once.has(name)) return; once.add(name); ev(name, tags); };
  const ROSEMARY = 'Rosemary St Residence';
  const TOP_MATCH = 'Isla F';
  const T2_REQUESTER = 'Sofia T';
  const isCrit = id => { const o = SHIFTS[id]; return !!o && o.kind === 'open' && o.urg === 'crit'; };
  const isRosemary = id => { const o = SHIFTS[id]; return !!o && o.kind === 'open' && o.roster === ROSEMARY && o.day === V2TODAY; };
  const ciById = id => ciRows().find(c => c.id === id);
  const isLeo = c => !!c && c.staff === 'Leo T' && c.roster === 'Raj Patel' && c.kind === 'out';
  const ciSec = () => [...document.querySelectorAll('section.card')].find(x => /Check-in and check-out health/.test(x.textContent));
  const nameOf = sh => { const p = STAFF.find(x => x.sh === sh); return p ? p.n : sh; };
  const shiftTag = id => { const o = SHIFTS[id]; return o ? o.roster + ' ' + o.time + ' (' + (o.urg || 'none') + ')' : 'unknown'; };

  /* Tasks 2 and 3: which shifts were opened */
  const _openQE = openQE;
  openQE = function(id){ const r = _openQE.apply(this, arguments);
    ev('shift_opened', { opened_shift: shiftTag(id) });
    if (isCrit(id)) evOnce('task2_critical_shift_opened');
    else if (isRosemary(id)) evOnce('task3_rosemary_shift_opened');
    else if (!once.has('task2_critical_shift_opened')) evOnce('task2_first_open_was_not_critical', { first_opened_shift: shiftTag(id) });
    return r; };

  /* Staff saved onto any shift */
  const _saveQE = saveQE;
  saveQE = function(id){ const st = (S.qeStaff || []).slice(); const crit = isCrit(id), rose = isRosemary(id);
    const r = _saveQE.apply(this, arguments);
    if (st.length) ev('staff_saved_on_shift', { saved_shift: shiftTag(id), saved_staff: st.map(nameOf).join(', ') });
    if (crit && st.includes(T2_REQUESTER)) evOnce('task2_done_requester_saved');
    else if (crit && st.length) evOnce('task2_other_staff_saved', { task2_saved_staff: st.map(nameOf).join(', ') });
    else if (crit) ev('task2_closed_without_staff');
    if (rose && st.length) evOnce('task3_staff_assigned_instead_of_offer', { task3_assigned_staff: st.map(nameOf).join(', ') });
    return r; };

  /* Task 3: offer sent (detected from the confirmation message) */
  const _toast = toast;
  toast = function(msg){ const r = _toast.apply(this, arguments);
    const m = /^Offer sent to (\d+)/.exec(String(msg));
    if (m) { const id = S.overlay && S.overlay.shift; const o = SHIFTS[id];
      const sent = o && o.offeredTo ? o.offeredTo.slice(-Number(m[1])) : [];
      const who = sent.map(nameOf).join(', ');
      if (isRosemary(id)) {
        if (sent.some(n => n !== 'Leo T')) evOnce('task3_done_offer_sent', { task3_offered_to: who });
        if (sent.includes(TOP_MATCH)) evOnce('task3_offer_includes_top_match'); else ev('task3_offer_not_top_match');
      } else ev('offer_sent_other_shift', { offer_shift: shiftTag(id), offer_to: who }); }
    return r; };

  /* Tasks 4, 5 and 6: rows marked as seen or resolved */
  const _ciResolve = ciResolve;
  ciResolve = function(id){ const c = ciById(id); const r = _ciResolve.apply(this, arguments);
    if (isLeo(c)) evOnce('task5_done_leo_marked_resolved');
    else if (c && c.kind === 'in') ev('checkin_marked_resolved', { last_resolved_staff: c.staff });
    else if (c) ev('checkout_marked_resolved_other', { last_resolved_staff: c.staff });
    return r; };

  /* Clicks: KPI cards, filter pills, load more, Leo rows */
  document.addEventListener('click', e => { const t = e.target; if (!t.closest) return;
    const kpi = t.closest('.kpi');
    if (kpi) { const l = kpi.querySelector('.l'); ev('task1_kpi_card_clicked', { kpi_clicked: l ? l.textContent : '' }); }
    const pill = t.closest('.kf');
    if (pill) ev('filter_pill_clicked', { filter_pill: pill.textContent.replace(/\s+/g,' ').trim() });
    const btn = t.closest('button');
    if (btn && /Load more/.test(btn.textContent)) { const sec = ciSec(); ev(sec && sec.contains(btn) ? 'checkin_load_more_clicked' : 'open_shifts_load_more_clicked'); }
    const tr = t.closest('tr');
    if (tr && /Leo Tran/.test(tr.textContent) && /Raj Patel/.test(tr.textContent)) evOnce('task5_leo_row_clicked');
    else if (tr && tr.classList.contains('clickrow') && /Leo Tran/.test(tr.textContent) && once.has('task4_done_all_missing_checkouts_shown')) ev('task5_leo_open_shift_row_clicked');
  }, true);

  /* After each redraw: staff picked in the drawer, check-in lists, panel in view */
  let io = null;
  const _r2 = render;
  render = function(){ _r2();
    if (S.overlay && S.overlay.type === 'qe') { const st = S.qeStaff || [];
      if (isCrit(S.overlay.shift) && st.includes(T2_REQUESTER)) evOnce('task2_requester_picked');
      if (isRosemary(S.overlay.shift) && st.includes('Leo T')) evOnce('task3_clashing_request_assigned'); }
    const sec = ciSec();
    if (!sec) return;
    const shown = [...sec.querySelectorAll('tbody tr')].map(r => r.cells[0] ? r.cells[0].textContent.trim() : '');
    const all = (k) => ciRows().filter(c => c.kind === k && !S.ciResolved.has(c.id)).map(c => nameOf(c.staff));
    const inN = all('in'), outN = all('out');
    if (inN.length && inN.every(n => shown.includes(n))) evOnce('all_missing_checkins_shown');
    if (outN.length && outN.every(n => shown.includes(n))) evOnce('task4_done_all_missing_checkouts_shown');
    if (once.has('checkin_panel_seen') || typeof IntersectionObserver !== 'function') return;
    if (io) io.disconnect();
    io = new IntersectionObserver(es => { if (es.some(x => x.isIntersecting)) { evOnce('checkin_panel_seen'); io.disconnect(); } }, { threshold: 0.3 });
    io.observe(sec); };
}

_goReal(STANDALONE_PAGE);
setNoticeHeight();
</script>
</body>
</html>
